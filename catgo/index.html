<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatGo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== SCREEN: Collection (Pokedex) ===== -->
  <div id="screenCollection" class="screen active">
    <div class="nav-bar">
      <div class="nav-title">CatGo</div>
      <div class="nav-subtitle" id="collectionCount">0 cats caught</div>
    </div>

    <div class="scroll-area" id="collectionGrid">
      <!-- empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🐾</div>
        <div class="empty-title">No cats yet</div>
        <div class="empty-sub">Go outside and catch your first cat!</div>
      </div>
    </div>

    <button class="fab" id="fabCapture" aria-label="Capture cat">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="4"/>
        <path d="M5 7H3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
        <path d="M8 7l2-3h4l2 3"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" />
  </div>

  <!-- ===== SCREEN: Processing ===== -->
  <div id="screenProcessing" class="screen">
    <div class="processing-bg" id="processingBg"></div>
    <div class="processing-content">
      <div class="sticker-wrap" id="stickerWrap">
        <img id="stickerImg" src="" alt="cat" />
      </div>
      <div class="processing-label">Identifying cat...</div>
      <div class="processing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ===== SCREEN: Fill Details ===== -->
  <div id="screenDetails" class="screen">
    <div class="sheet-header">
      <button class="btn-ghost-icon" id="detailsBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <div class="sheet-title">Name your cat</div>
      <div style="width:36px"></div>
    </div>

    <div class="scroll-area">
      <div class="detail-preview-wrap">
        <div class="detail-sticker-wrap">
          <img id="detailStickerImg" src="" alt="cat" />
        </div>
        <div class="rarity-badge" id="rarityBadge">Common</div>
      </div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label">Nickname</label>
          <input class="form-input" id="inputNickname" type="text" placeholder="e.g. Orange Bandit" maxlength="30" />
        </div>
        <div class="form-group">
          <label class="form-label">Where did you find it?</label>
          <input class="form-input" id="inputLocation" type="text" placeholder="e.g. Near the market" maxlength="50" />
        </div>
      </div>

      <button class="btn-primary full-width" id="btnSave">Add to Collection</button>
    </div>
  </div>

  <!-- ===== SCREEN: Cat Detail ===== -->
  <div id="screenCatDetail" class="screen">
    <div class="detail-hero-wrap">
      <div class="detail-hero-bg" id="detailHeroBg"></div>
      <button class="btn-back-circle" id="catDetailBack">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <div class="detail-hero-sticker">
        <img id="detailHeroImg" src="" alt="cat" />
      </div>
    </div>

    <div class="detail-info-card">
      <div class="detail-name-row">
        <div class="detail-cat-name" id="detailCatName">Cat Name</div>
        <span class="rarity-badge" id="detailRarity">Common</span>
      </div>
      <div class="detail-meta-row">
        <div class="detail-meta-item">
          <span class="detail-meta-icon">📍</span>
          <span class="detail-meta-text" id="detailLocation">—</span>
        </div>
        <div class="detail-meta-item">
          <span class="detail-meta-icon">📅</span>
          <span class="detail-meta-text" id="detailDate">—</span>
        </div>
      </div>
      <div class="detail-dex-row">
        <span class="dex-number" id="detailDexNo">#001</span>
        <span class="dex-label">in your collection</span>
      </div>

      <button class="btn-ghost-danger" id="btnDeleteCat">Delete from collection</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
